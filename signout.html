<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduSpark - Sign Out</title>

    <link rel="stylesheet" href="signout.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="signout-container">

        <div class="signout-card">

            <div class="logo">
                EduSpark
            </div>

            <div class="icon-circle">
                <i class="fas fa-check"></i>
            </div>

            <h1>Signed Out Successfully</h1>

            <p>
                You have been safely signed out of your EduSpark account.
            </p>

            <p class="thank-you">
                Thank you for using EduSpark!
            </p>

            <button onclick="signInAgain()">
                <i class="fas fa-sign-in-alt"></i>
                Sign In Again
            </button>

            <div class="footer">
                © 2026 EduSpark. All rights reserved.
            </div>

        </div>

    </div>


    <script>

        function signInAgain() {

            window.location.href = "login.html";

        }

    </script>

</body>

</html>
